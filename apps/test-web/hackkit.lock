{
  "version": 1,
  "plugins": [
    {
      "id": "teams",
      "package": "@hackkit/plugin-teams",
      "version": "0.0.0",
      "routes": [
        {
          "host": "app/invites/page.tsx",
          "source": "@hackkit/plugin-teams/app/invites/page"
        },
        {
          "host": "app/teams/page.tsx",
          "source": "@hackkit/plugin-teams/app/teams/page"
        }
      ],
      "actions": [
        "createTeam",
        "inviteToTeam",
        "respondToInvite",
        "leaveTeam",
        "removeMember"
      ]
    },
    {
      "id": "discord",
      "package": "@hackkit/plugin-discord",
      "version": "0.0.0",
      "routes": [
        {
          "host": "app/discord/page.tsx",
          "source": "@hackkit/plugin-discord/app/discord/page"
        },
        {
          "host": "app/discord/verify/page.tsx",
          "source": "@hackkit/plugin-discord/app/discord/verify/page"
        }
      ],
      "actions": [
        "confirmDiscordVerification",
        "syncDiscordMemberRoles"
      ]
    },
    {
      "id": "notificationsEmail",
      "package": "@hackkit/plugin-notifications-email",
      "version": "0.0.0",
      "routes": [],
      "actions": []
    }
  ]
}
